<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحدي أبطال الدراسات الاجتماعية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet">
    <!-- مكتبة Firebase من جوجل لربط لوحة الصدارة سحابياً -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --primary: #1e3a8a;
            --primary-light: #3b82f6;
            --secondary: #059669;
            --accent: #f59e0b;
            --danger: #ef4444;
            --bg: #f0fdf4;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border-rad: 20px;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #e0f2fe 0%, #dcfce7 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            color: var(--text-main);
        }

        .game-card {
            background: var(--card-bg);
            border-radius: var(--border-rad);
            width: 100%;
            max-width: 680px;
            box-shadow: var(--shadow);
            padding: 24px;
            position: relative;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.8);
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid #f3f4f6;
        }

        .badge {
            background: #e0e7ff;
            color: var(--primary);
            padding: 6px 14px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .score-pill {
            background: #fef3c7;
            color: #b45309;
            padding: 6px 14px;
            border-radius: 50px;
            font-weight: 800;
        }

        .progress-container {
            width: 100%;
            height: 10px;
            background-color: #e5e7eb;
            border-radius: 10px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-light), var(--secondary));
            width: 0%;
            transition: width 0.4s ease;
        }

        .screen {
            display: none;
            animation: fadeIn 0.4s ease-out forwards;
        }

        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            color: var(--primary);
            font-size: 1.8rem;
            font-weight: 900;
            text-align: center;
            margin-bottom: 12px;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 24px;
            font-size: 1.05rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            color: var(--primary);
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            font-size: 1.1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary-light);
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: #fff;
            border: none;
            border-radius: 14px;
            font-size: 1.15rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(37, 99, 235, 0.35);
        }

        .question-box {
            font-size: 1.25rem;
            font-weight: 800;
            color: #1e293b;
            line-height: 1.6;
            margin-bottom: 16px;
        }

        .illustration {
            width: 100%;
            max-height: 190px;
            margin-bottom: 20px;
            background: #f8fafc;
            border-radius: 14px;
            border: 1px dashed #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
        }

        .illustration svg {
            width: 100%;
            height: 100%;
            max-height: 170px;
        }

        .options-list {
            display: grid;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 700;
            text-align: right;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .option-btn:hover:not(.disabled) {
            background: #eff6ff;
            border-color: var(--primary-light);
            transform: translateX(-4px);
        }

        .option-btn.correct {
            background: #dcfce7 !important;
            border-color: #22c55e !important;
            color: #15803d !important;
        }

        .option-btn.wrong {
            background: #fee2e2 !important;
            border-color: #ef4444 !important;
            color: #b91c1c !important;
        }

        .tf-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .tf-btn {
            padding: 18px;
            border-radius: 14px;
            font-size: 1.3rem;
            font-weight: 800;
            border: 2px solid transparent;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            transition: transform 0.15s;
        }

        .tf-btn.true-btn {
            background: #ecfdf5;
            color: #047857;
            border-color: #a7f3d0;
        }

        .tf-btn.false-btn {
            background: #fef2f2;
            color: #b91c1c;
            border-color: #fecaca;
        }

        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
            margin: 16px 0;
            border-radius: 10px;
            overflow: hidden;
        }

        .leaderboard-table th {
            background: var(--primary);
            color: white;
            padding: 12px;
            font-size: 0.95rem;
            text-align: center;
        }

        .leaderboard-table td {
            padding: 10px 12px;
            border-bottom: 1px solid #e2e8f0;
            text-align: center;
            font-weight: 700;
        }

        .leaderboard-table tr:nth-child(even) {
            background: #f8fafc;
        }

        .leaderboard-table tr:first-child td {
            color: #b45309;
            background: #fef3c7;
            font-size: 1.05rem;
        }

        .status-sync {
            font-size: 0.95rem;
            color: #2563eb;
            text-align: center;
            margin-bottom: 8px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="game-card">
        <!-- شاشة تسجيل الدخول والبدء -->
        <div id="start-screen" class="screen active">
            <div style="text-align:center; font-size: 3rem; margin-bottom: 8px;">🧭</div>
            <h1>مغامرة الجغرافي الصغير</h1>
            <p class="subtitle">تحدّ زملاءك، أجب عن 44 مرحلة واحتل صدارة لوحة الشرف الموحدة!</p>
            
            <div class="form-group">
                <label for="player-name">اسم البطل / الطالب:</label>
                <input type="text" id="player-name" placeholder="اكتب اسمك الثلاثي..." autocomplete="off">
            </div>

            <button class="btn" onclick="startGame()">انطلاق التحدي 🚀</button>
        </div>

        <!-- شاشة الأسئلة واللعب -->
        <div id="quiz-screen" class="screen">
            <div class="header-bar">
                <div class="badge" id="stage-badge">المرحلة: 1 / 44</div>
                <div class="score-pill" id="score-badge">النقاط: 0</div>
            </div>

            <div class="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>

            <div id="illustration-container"></div>

            <div class="question-box" id="question-text">نص السؤال يظهر هنا...</div>

            <div id="options-container"></div>
        </div>

        <!-- شاشة النهاية ولوحة المراكز المركزية -->
        <div id="result-screen" class="screen">
            <div style="text-align:center; font-size: 3rem; margin-bottom: 6px;">🏆</div>
            <h1>مبروك إنهاء التحدي!</h1>
            <p class="subtitle" id="final-stats">أحسنت يا بطل!</p>

            <h3 style="color: var(--primary); margin-bottom: 6px; text-align: center;">جدول ترتيب جميع المتسابقين 🌟</h3>
            <div id="sync-status" class="status-sync">جاري جلب ترتيب الأوائل من السحابة...</div>
            <table class="leaderboard-table">
                <thead>
                    <tr>
                        <th>المركز</th>
                        <th>اسم الطالب</th>
                        <th>الدرجة</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body">
                    <!-- تتعبأ مباشرة من قاعدة البيانات المشتركة -->
                </tbody>
            </table>

            <button class="btn" style="margin-top: 14px;" onclick="resetGame()">إعادة التحدي 🔄</button>
        </div>
    </div>

    <script>
        // إعداد اتصال Firebase Realtime السحابي المباشر
        const firebaseConfig = {
            databaseURL: "https://school-quiz-board-default-rtdb.firebaseio.com"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();
        const scoresRef = db.ref('social_studies_scores');

        // المؤثرات الصوتية
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(freq, type, duration) {
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
                osc.stop(audioCtx.currentTime + duration);
            } catch(e){}
        }

        function soundCorrect() {
            playTone(523.25, 'sine', 0.15);
            setTimeout(() => playTone(659.25, 'sine', 0.2), 100);
            setTimeout(() => playTone(783.99, 'sine', 0.3), 200);
        }

        function soundWrong() {
            playTone(220, 'triangle', 0.25);
            setTimeout(() => playTone(180, 'triangle', 0.35), 180);
        }

        // الأشكال التوضيحية
        const compassSVG = `
            <div class="illustration">
                <svg viewBox="0 0 200 200">
                    <circle cx="100" cy="100" r="90" fill="#f8fafc" stroke="#3b82f6" stroke-width="2"/>
                    <path d="M100 20 L110 90 L100 100 L90 90 Z" fill="#ef4444"/>
                    <path d="M100 180 L110 110 L100 100 L90 110 Z" fill="#1e3a8a"/>
                    <path d="M180 100 L110 110 L100 100 L110 90 Z" fill="#10b981"/>
                    <path d="M20 100 L90 110 L100 100 L90 90 Z" fill="#f59e0b"/>
                    <text x="100" y="16" font-size="12" font-weight="bold" text-anchor="middle" fill="#ef4444">الشمال</text>
                    <text x="100" y="196" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e3a8a">الجنوب</text>
                    <text x="195" y="104" font-size="12" font-weight="bold" text-anchor="start" fill="#10b981">الشرق</text>
                    <text x="5" y="104" font-size="12" font-weight="bold" text-anchor="end" fill="#f59e0b">الغرب</text>
                </svg>
            </div>
        `;

        const sunSVG = `
            <div class="illustration">
                <svg viewBox="0 0 220 120">
                    <circle cx="170" cy="35" r="22" fill="#fbbf24" stroke="#f59e0b" stroke-width="3"/>
                    <circle cx="90" cy="70" r="14" fill="#fed7aa"/>
                    <rect x="84" y="84" width="12" height="26" fill="#3b82f6" rx="3"/>
                    <line x1="96" y1="88" x2="150" y2="50" stroke="#f59e0b" stroke-width="3" stroke-dasharray="4"/>
                    <text x="170" y="75" font-size="11" font-weight="bold" text-anchor="middle" fill="#b45309">الشرق (الشمس)</text>
                    <text x="25" y="90" font-size="11" font-weight="bold" fill="#64748b">الغرب (خلفه)</text>
                    <text x="90" y="30" font-size="11" font-weight="bold" text-anchor="middle" fill="#0284c7">الشمال (يساره)</text>
                </svg>
            </div>
        `;

        const gridMapSVG = `
            <div class="illustration">
                <svg viewBox="0 0 240 130" style="background:#e2e8f0; border-radius:8px;">
                    <line x1="40" y1="10" x2="40" y2="120" stroke="#94a3b8" stroke-width="1"/>
                    <line x1="80" y1="10" x2="80" y2="120" stroke="#94a3b8" stroke-width="1"/>
                    <line x1="120" y1="10" x2="120" y2="120" stroke="#94a3b8" stroke-width="1"/>
                    <line x1="160" y1="10" x2="160" y2="120" stroke="#94a3b8" stroke-width="1"/>
                    <line x1="200" y1="10" x2="200" y2="120" stroke="#94a3b8" stroke-width="1"/>

                    <line x1="10" y1="35" x2="230" y2="35" stroke="#94a3b8" stroke-width="1"/>
                    <line x1="10" y1="65" x2="230" y2="65" stroke="#94a3b8" stroke-width="1"/>
                    <line x1="10" y1="95" x2="230" y2="95" stroke="#94a3b8" stroke-width="1"/>

                    <text x="215" y="25" font-size="10" font-weight="bold">١</text>
                    <text x="180" y="25" font-size="10" font-weight="bold">٢</text>
                    <text x="140" y="25" font-size="10" font-weight="bold">٣</text>
                    <text x="100" y="25" font-size="10" font-weight="bold">٤</text>
                    <text x="60" y="25" font-size="10" font-weight="bold">٥</text>

                    <text x="232" y="52" font-size="10" font-weight="bold">أ</text>
                    <text x="232" y="82" font-size="10" font-weight="bold">ج</text>
                    <text x="232" y="112" font-size="10" font-weight="bold">هـ</text>

                    <rect x="48" y="98" width="24" height="18" fill="#ef4444" rx="3"/>
                    <text x="60" y="111" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">+</text>
                    <text x="60" y="92" font-size="9" font-weight="bold" fill="#ef4444" text-anchor="middle">المستشفى</text>
                </svg>
            </div>
        `;

        // بنك الأسئلة الـ 44
        const questions = [
            { type: 'mcq', q: "كيف يتفاعل الإنسان مع المكان (البيئة)؟", opts: ["من خلال وصف الجبال", "من خلال تحديد الموقع بالخرائط", "من خلال بناء الطرق والمدن", "من خلال دراسة المناخ"], ans: 2 },
            { type: 'mcq', q: "لتسمية الجهات الفرعية نبدأ دائماً بجهتي:", opts: ["الشرق والغرب", "الشمال والجنوب", "الشرق والشمال", "الغرب والجنوب"], ans: 1 },
            { type: 'mcq', q: "تقع المملكة العربية السعودية في أقصى الجنوب الغربي من قارة:", opts: ["آسيا", "إفريقيا", "أوروبا", "أستراليا"], ans: 0 },
            { type: 'mcq', q: "تظهر الصورة قطاراً يحمل البضائع من مدينة إلى أخرى، أي عناصر الجغرافيا يمثله هذا العمل؟", opts: ["الموقع", "الطبيعة", "الحركة", "البيئة"], ans: 2 },
            { type: 'mcq', q: "العلم الذي يدرس كل ما يتعلق بالكرة الأرضية وتكوينها وما يحدث على سطحها هو:", opts: ["التاريخ", "الجغرافيا", "الأحياء", "الفلك"], ans: 1 },
            { type: 'mcq', q: "بالنظر إلى شبكة الخريطة، ما موقع المستشفى؟", opts: ["١ - أ", "١ - ب", "٣ - ج", "٥ - هـ"], ans: 3, svg: gridMapSVG },
            { type: 'mcq', q: "أي الأمور الآتية تدرسه الجغرافيا الطبيعية؟", opts: ["بناء الطرق والجسور", "الماء واليابسة والمناخ والنباتات والحيوانات", "نقل البضائع بين المدن", "نشاط الإنسان في المكان وتعامله معه"], ans: 1 },
            { type: 'mcq', q: "ما هو السؤال الذي يطرحه الجغرافي لمعرفة الموقع؟", opts: ["ما هو؟", "أين هو؟", "كيف نتصرف تجاه المكان؟", "كيف يرتبط المكان بأماكن أخرى؟"], ans: 1 },
            { type: 'mcq', q: "تقع المملكة العربية السعودية في أقصى الجنوب الغربي من قارة:", opts: ["أوروبا", "إفريقيا", "آسيا", "أستراليا"], ans: 2 },
            { type: 'mcq', q: "يقف طفل في الصباح والشمس أمامه، أين تقع جهة الغرب بالنسبة له؟", opts: ["أمامه", "عن يمينه", "خلفه", "عن يساره"], ans: 2, svg: sunSVG },
            { type: 'mcq', q: "عدد الجهات الأصلية هو:", opts: ["٣ جهات", "٤ جهات", "٥ جهات", "٦ جهات"], ans: 1, svg: compassSVG },
            { type: 'mcq', q: "أي الجهات الآتية ليست من الجهات الأصلية؟", opts: ["الشمال", "الشرق", "الغرب", "الجنوب الغربي"], ans: 3 },
            { type: 'mcq', q: "ما المقصود بالجغرافيا؟", opts: ["دراسة أحداث الماضي وتواريخها", "كل ما يتعلق بالكرة الأرضية وتكوينها وما يحدث على سطحها", "دراسة قواعد اللغة العربية", "دراسة الأعداد والحساب"], ans: 1 },
            { type: 'mcq', q: "استعان طالب بالخريطة لمعرفة مدرسته. ما السؤال الذي يسأله الجغرافي لتحديد الموقع؟", opts: ["ما هو؟", "كيف نتصرف تجاه المكان؟", "كيف يرتبط المكان بأماكن أخرى؟", "أين هو؟"], ans: 3 },
            { type: 'mcq', q: "أي من الآتي يعتبر من الجهات الفرعية؟", opts: ["الشمال", "الجنوب", "الشرق", "الشمال الشرقي"], ans: 3, svg: compassSVG },
            { type: 'mcq', q: "كم عدد الجهات الفرعية؟", opts: ["جهتان", "أربع جهات", "ست جهات", "ثماني جهات"], ans: 1 },
            { type: 'mcq', q: "دراسة المناخ والنباتات والحيوانات تندرج تحت قسم:", opts: ["الجغرافيا البشرية", "الجغرافيا الطبيعية", "التاريخ الحديث", "البيئة العمرانية"], ans: 1 },
            { type: 'mcq', q: "أي مما يلي يُعد مثالاً على الحركة في الجغرافيا؟", opts: ["بناء الجسور والمدن", "الجبال والأنهار", "نقل البضائع من مكان إلى آخر", "تحديد موقع المدرسة"], ans: 2 },
            { type: 'mcq', q: "تربط المملكة العربية السعودية بين ثلاث قارات هي:", opts: ["إفريقيا وأوروبا وآسيا", "آسيا وأمريكا وأوروبا", "إفريقيا وأستراليا وأمريكا", "أوروبا وأمريكا وإفريقيا"], ans: 0 },
            { type: 'mcq', q: "نقل النفط عبر ناقلات الشحن البحري من المملكة إلى الصين يمثل في الجغرافيا عنصر:", opts: ["الحركة", "البيئة", "الموقع", "الطبيعة"], ans: 0 },
            { type: 'mcq', q: "تفاعل الإنسان مع المكان وبناؤه للمدن والطرق يُسمّى في الجغرافيا:", opts: ["الموقع", "الحركة", "البيئة", "الطبيعة"], ans: 2 },
            { type: 'mcq', q: "عندما تكون الشمس أمامك في الصباح، فإن جهة الشمال تكون:", opts: ["خلفك", "عن يمينك", "عن يسارك", "أمامك"], ans: 2, svg: sunSVG },
            { type: 'tf', q: "تساعدنا معرفة اتجاه القبلة في مكة المكرمة على تحديد الجهات.", ans: true },
            { type: 'tf', q: "الماء واليابسة والمناخ والنباتات والحيوانات مما تدرسه الجغرافيا الطبيعية.", ans: true },
            { type: 'tf', q: "لا تفيدنا الخريطة في معرفة مواقع القارات والدول.", ans: false },
            { type: 'tf', q: "يسأل الجغرافي سؤالين اثنين فقط عن المكان.", ans: false },
            { type: 'tf', q: "حينما تكون الشمس أمامي في الصباح يكون الجنوب عن يساري.", ans: false, svg: sunSVG },
            { type: 'tf', q: "نقل النفط ومشتقاته يعتبر جزءاً من مفهوم الحركة في الجغرافيا.", ans: true },
            { type: 'tf', q: "إذا كانت الشمس أمامك في الصباح فإن الغرب يكون عن يمينك.", ans: false, svg: sunSVG },
            { type: 'tf', q: "تقع المملكة العربية السعودية في أقصى الشمال الشرقي من قارة آسيا.", ans: false },
            { type: 'tf', q: "الجغرافيا فرعان: جغرافيا طبيعية وجغرافيا بشرية.", ans: true },
            { type: 'tf', q: "بناء الطرق والجسور والمدن مثال على تفاعل الإنسان مع المكان.", ans: true },
            { type: 'tf', q: "تقع المملكة العربية السعودية في قارة أوروبا.", ans: false },
            { type: 'tf', q: "الشمال الغربي والجنوب الشرقي من الجهات الأصلية.", ans: false, svg: compassSVG },
            { type: 'tf', q: "تحديد الجهات يساعد المسلم على معرفة اتجاه القبلة لأداء الصلاة.", ans: true },
            { type: 'tf', q: "عندما يصف الجغرافي الطبيعة فإنه يسأل: كيف يرتبط المكان بأماكن أخرى؟", ans: false },
            { type: 'tf', q: "الجغرافيا البشرية تهتم بدراسة ما على سطح الأرض من ماء ويابسة ومناخ.", ans: false },
            { type: 'tf', q: "تساعدنا التقنية الحديثة مثل خرائط جوجل على معرفة الموقع.", ans: true },
            { type: 'tf', q: "الجغرافي هو الشخص الذي يدرس مظاهر الأرض وطبيعتها وسكانها.", ans: true },
            { type: 'tf', q: "رسم الإنسان الخرائط واستعملها منذ آلاف السنين لمعرفة المواقع.", ans: true },
            { type: 'tf', q: "الجهات الأصلية أربع، هي: الشمال والجنوب، والشرق والغرب.", ans: true, svg: compassSVG },
            { type: 'tf', q: "تربط المملكة العربية السعودية بين قارات إفريقيا وأوروبا وآسيا.", ans: true },
            { type: 'tf', q: "نقل البضائع من مكان إلى آخر يُسمّى في الجغرافيا الطبيعة.", ans: false },
            { type: 'tf', q: "الجنوب الغربي يعتبر من الجهات الفرعية.", ans: true, svg: compassSVG }
        ];

        let currentQuestion = 0;
        let score = 0;
        let playerName = "";
        let answersLocked = false;

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function startGame() {
            const input = document.getElementById('player-name');
            if (!input.value.trim()) {
                alert("فضلًا اكتب اسمك أولاً للدخول إلى التحدي!");
                return;
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            playerName = input.value.trim();
            currentQuestion = 0;
            score = 0;
            showScreen('quiz-screen');
            renderQuestion();
        }

        function renderQuestion() {
            answersLocked = false;
            const q = questions[currentQuestion];
            
            document.getElementById('stage-badge').innerText = `المرحلة: ${currentQuestion + 1} / ${questions.length}`;
            document.getElementById('score-badge').innerText = `النقاط: ${score}`;
            document.getElementById('progress-bar').style.width = `${((currentQuestion) / questions.length) * 100}%`;

            document.getElementById('question-text').innerText = `${currentQuestion + 1}. ${q.q}`;
            const illusContainer = document.getElementById('illustration-container');
            illusContainer.innerHTML = q.svg ? q.svg : '';

            const optsContainer = document.getElementById('options-container');
            optsContainer.innerHTML = '';

            if (q.type === 'mcq') {
                const list = document.createElement('div');
                list.className = 'options-list';
                q.opts.forEach((opt, idx) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.innerHTML = `<span>${opt}</span><span style="opacity:0.6; font-size:0.85rem;">[${['أ','ب','ج','د'][idx]}]</span>`;
                    btn.onclick = () => checkMCQ(idx, btn);
                    list.appendChild(btn);
                });
                optsContainer.appendChild(list);
            } else {
                const grid = document.createElement('div');
                grid.className = 'tf-grid';
                grid.innerHTML = `
                    <button class="tf-btn true-btn" onclick="checkTF(true, this)">
                        <span>✔</span>
                        <span>صواب</span>
                    </button>
                    <button class="tf-btn false-btn" onclick="checkTF(false, this)">
                        <span>✖</span>
                        <span>خطأ</span>
                    </button>
                `;
                optsContainer.appendChild(grid);
            }
        }

        function checkMCQ(chosenIdx, btn) {
            if (answersLocked) return;
            answersLocked = true;
            const q = questions[currentQuestion];
            const allBtns = document.querySelectorAll('.option-btn');

            if (chosenIdx === q.ans) {
                btn.classList.add('correct');
                score++;
                soundCorrect();
            } else {
                btn.classList.add('wrong');
                allBtns[q.ans].classList.add('correct');
                soundWrong();
            }

            document.getElementById('score-badge').innerText = `النقاط: ${score}`;
            setTimeout(nextQuestion, 1100);
        }

        function checkTF(chosenVal, btn) {
            if (answersLocked) return;
            answersLocked = true;
            const q = questions[currentQuestion];

            if (chosenVal === q.ans) {
                btn.style.transform = "scale(1.05)";
                btn.style.boxShadow = "0 0 15px #22c55e";
                score++;
                soundCorrect();
            } else {
                btn.style.boxShadow = "0 0 15px #ef4444";
                soundWrong();
            }

            document.getElementById('score-badge').innerText = `النقاط: ${score}`;
            setTimeout(nextQuestion, 1100);
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < questions.length) {
                renderQuestion();
            } else {
                finishGame();
            }
        }

        function finishGame() {
            showScreen('result-screen');
            document.getElementById('final-stats').innerText = `البطل: ${playerName} | درجاتك: ${score} من ${questions.length}`;
            saveScoreFirebase(playerName, score);
        }

        // إرسال النتيجة إلى Firebase والاستماع لترتيب جميع الطلاب لحظياً
        function saveScoreFirebase(name, pts) {
            const status = document.getElementById('sync-status');
            status.innerText = "⏳ جاري إرسال نتيجتك وترتيب قائمة الأبطال...";

            // إضافة اسم ودرجة الطالب في قاعدة البيانات المركزية
            scoresRef.push({
                name: name,
                score: pts,
                timestamp: Date.now()
            }).then(() => {
                status.innerText = "✅ تم حفظ نتيجتك وتحديث لوحة الشرف!";
            }).catch(() => {
                status.innerText = "تم حفظ النتيجة محلياً!";
            });

            // قراءة جميع نتائج الطلاب وفرزها من الأعلى للأدنى
            scoresRef.on('value', (snapshot) => {
                const data = snapshot.val();
                let list = [];
                if (data) {
                    for (let key in data) {
                        list.push(data[key]);
                    }
                }
                // فرز بالدرجة الأعلى، وفي حال التساوي بالأسبق
                list.sort((a, b) => b.score - a.score || a.timestamp - b.timestamp);
                renderLeaderboard(list);
            });
        }

        function renderLeaderboard(list) {
            const tbody = document.getElementById('leaderboard-body');
            tbody.innerHTML = '';
            list.forEach((entry, idx) => {
                const tr = document.createElement('tr');
                const medal = idx === 0 ? '🥇 الأول' : idx === 1 ? '🥈 الثاني' : idx === 2 ? '🥉 الثالث' : `${idx + 1}`;
                if (entry.name === playerName && entry.score === score) {
                    tr.style.backgroundColor = '#ecfdf5';
                    tr.style.color = '#047857';
                    tr.style.fontWeight = '900';
                }
                tr.innerHTML = `
                    <td>${medal}</td>
                    <td>${entry.name}</td>
                    <td>${entry.score} / 44</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function resetGame() {
            document.getElementById('player-name').value = '';
            showScreen('start-screen');
        }
    </script>
